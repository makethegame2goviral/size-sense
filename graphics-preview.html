<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Size Sense · 100 Grafiken prüfen</title><style>body{background:#101528;color:#fff;font:16px system-ui;margin:24px}a{color:#b8fa60}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}figure{margin:0;background:#192238;padding:20px;border-radius:16px}figure div{height:140px;display:flex;align-items:center;justify-content:center}figcaption{margin-top:15px}</style><a href="./">← Zum Spiel</a><h1>100 Gegenstände · Grafikkontrolle</h1><p>Jeder Katalogeintrag besitzt eine ausdrückliche Zuordnung. Die Zeichnungen sind stilisierte Modelle, keine exakten technischen Ansichten.</p><main id="gallery"></main><script type="module">import{catalog,svg}from'./graphics.js';for(const s of catalog.values()){const f=document.createElement('figure'),d=document.createElement('div'),c=document.createElement('figcaption');const h=Math.min(125,170/s.ratio),w=h*s.ratio;d.innerHTML=svg(s,'#70b9ff',w,h);c.textContent=s.name;f.append(d,c);document.getElementById('gallery').append(f)}</script></html>
